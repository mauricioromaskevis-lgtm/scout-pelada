<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Scout da Pelada</title><meta name="theme-color" content="#0d6b43"><link rel="manifest" href="manifest.json">
<style>
:root{--g:#0d6b43;--g2:#168f5c;--bg:#f2f5f3;--card:#fff;--text:#17211c;--muted:#65726b;--line:#dfe7e2;--gold:#d99c19}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--text)}header{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:22px 18px 18px;position:sticky;top:0;z-index:3}header h1{margin:0;font-size:23px}header p{margin:5px 0 0;opacity:.88;font-size:13px}main{max-width:1000px;margin:auto;padding:14px 14px 88px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 3px 12px #173d2710}.kpi b{display:block;font-size:25px;color:var(--g)}.kpi span,.muted{font-size:12px;color:var(--muted)}.title{margin:18px 0 10px}.title h2{font-size:18px;margin:0}.rank-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.rank-row{display:grid;grid-template-columns:32px 1fr 58px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.rank-row:last-child{border-bottom:0}.rank1{font-weight:900;color:var(--gold)}table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}th,td{padding:11px 8px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}th{color:var(--muted);font-size:11px;text-transform:uppercase}.search{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:white;font:inherit;margin-bottom:10px}.history-item{padding:12px 0;border-bottom:1px solid var(--line)}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8f5ed;color:var(--g);font-size:11px;font-weight:700;margin-top:6px}.empty{text-align:center;color:var(--muted);padding:30px}.status{font-size:12px;opacity:.9;margin-top:5px}.refresh{border:1px solid #ffffff55;background:#ffffff18;color:#fff;border-radius:10px;padding:6px 9px;float:right}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;padding-bottom:env(safe-area-inset-bottom)}nav button{border:0;background:none;padding:13px 22px;color:var(--muted);font-weight:700}nav button.active{color:var(--g)}section{display:none}section.active{display:block}@media(max-width:760px){.rank-grid{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}nav button{padding:12px 14px;font-size:12px}}
</style></head><body>
<header><button class="refresh" onclick="loadData()">Atualizar</button><h1>⚽ Scout da Pelada</h1><p>Ranking oficial de gols, assistências e títulos</p><div class="status" id="status">Carregando...</div></header>
<main><section id="home" class="active"><div class="grid" id="kpis"></div><div class="rank-grid" style="margin-top:14px"><div class="card"><div class="title" style="margin-top:0"><h2>⚽ Artilharia</h2></div><div id="topGoals"></div></div><div class="card"><div class="title" style="margin-top:0"><h2>🅰️ Assistências</h2></div><div id="topAssists"></div></div><div class="card"><div class="title" style="margin-top:0"><h2>🏆 Campeões</h2></div><div id="topTitles"></div></div></div><div class="title"><h2>Última rodada</h2></div><div class="card" id="lastRound"></div></section>
<section id="ranking"><div class="title"><h2>Ranking completo</h2></div><input class="search" id="rankSearch" placeholder="Buscar jogador..."><div style="overflow:auto"><table><thead><tr><th>Jogador</th><th>Gols</th><th>Assist.</th><th>Títulos</th><th>Rodadas</th></tr></thead><tbody id="rankingBody"></tbody></table></div></section>
<section id="rounds"><div class="title"><h2>Histórico das rodadas</h2></div><div class="card" id="history"></div></section></main>
<nav><button class="active" data-page="home">Início</button><button data-page="ranking">Rankings</button><button data-page="rounds">Rodadas</button></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const db=supabase.createClient(PELADA_CONFIG.supabaseUrl,PELADA_CONFIG.supabasePublishableKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});let players=[],rounds=[],scouts=[];
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function totalFor(p){const ps=scouts.filter(s=>s.jogador_id===p.id);return{p,g:(p.gols_iniciais||0)+ps.reduce((n,s)=>n+(s.gols||0),0),a:(p.assistencias_iniciais||0)+ps.reduce((n,s)=>n+(s.assistencias||0),0),t:ps.filter(s=>s.campeao).length,r:ps.length}}
function all(){return players.filter(p=>p.ativo!==false).map(totalFor)} function by(k){return all().sort((x,y)=>y[k]-x[k]||y.g-x.g||y.a-x.a||x.p.nome.localeCompare(y.p.nome,'pt-BR'))}
function topHtml(items,key){return items.slice(0,5).map((x,i)=>`<div class="rank-row"><b class="${i===0?'rank1':''}">${i+1}º</b><span>${esc(x.p.nome)}</span><b>${x[key]}</b></div>`).join('')||'<div class="empty">Sem dados.</div>'}
function roundScouts(id){return scouts.filter(s=>s.rodada_id===id)} function pname(id){return players.find(p=>p.id===id)?.nome||'Jogador'}
function roundHTML(rd){const ss=roundScouts(rd.id),champ=ss.filter(s=>s.campeao).map(s=>esc(pname(s.jogador_id))).join(', ')||'Não informado',g=ss.reduce((n,s)=>n+(s.gols||0),0),a=ss.reduce((n,s)=>n+(s.assistencias||0),0);return `<b>${new Date(rd.data+'T12:00:00').toLocaleDateString('pt-BR')}</b><div class="muted">${ss.length} jogadores · ${g} gols · ${a} assistências</div><div><span class="pill">Campeões: ${champ}</span></div>${rd.observacao?`<div class="muted" style="margin-top:7px">${esc(rd.observacao)}</div>`:''}`}
function render(){const ps=all();kpis.innerHTML=`<div class="card kpi"><b>${ps.length}</b><span>jogadores ativos</span></div><div class="card kpi"><b>${ps.reduce((n,x)=>n+x.g,0)}</b><span>gols acumulados</span></div><div class="card kpi"><b>${rounds.length}</b><span>rodadas registradas</span></div>`;topGoals.innerHTML=topHtml(by('g'),'g');topAssists.innerHTML=topHtml(by('a'),'a');topTitles.innerHTML=topHtml(by('t'),'t');lastRound.innerHTML=rounds.length?roundHTML(rounds[rounds.length-1]):'<div class="empty">Nenhuma rodada.</div>';renderRanking();history.innerHTML=rounds.length?rounds.slice().reverse().map(r=>`<div class="history-item">${roundHTML(r)}</div>`).join(''):'<div class="empty">Nenhuma rodada.</div>'}
function renderRanking(){const q=(rankSearch.value||'').toLowerCase();rankingBody.innerHTML=all().filter(x=>x.p.nome.toLowerCase().includes(q)).sort((x,y)=>y.g-x.g||y.a-x.a||y.t-x.t||x.p.nome.localeCompare(y.p.nome,'pt-BR')).map(x=>`<tr><td><b>${esc(x.p.nome)}</b></td><td>${x.g}</td><td>${x.a}</td><td>${x.t}</td><td>${x.r}</td></tr>`).join('')}
async function loadData(){status.textContent='Atualizando...';const [p,r,s]=await Promise.all([db.from('jogadores').select('*').order('nome'),db.from('rodadas').select('*').order('data'),db.from('scouts').select('*')]);if(p.error||r.error||s.error){console.error(p.error||r.error||s.error);status.textContent='Erro ao carregar dados';return}players=p.data||[];rounds=r.data||[];scouts=s.data||[];render();status.textContent='Atualizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,section').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.page).classList.add('active');render()});rankSearch.oninput=renderRanking;loadData();setInterval(loadData,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadData()});
</script></body></html>
