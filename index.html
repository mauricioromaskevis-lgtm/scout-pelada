<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scout da Pelada</title><meta name="theme-color" content="#0d6b43"><link rel="manifest" href="manifest.json">
<style>
:root{--green:#0d6b43;--green2:#168f5c;--bg:#f2f5f3;--card:#fff;--text:#17211c;--muted:#65726b;--line:#dfe7e2;--gold:#d99c19}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--text)}header{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;padding:22px 18px 18px;position:sticky;top:0;z-index:3}header h1{margin:0;font-size:23px}header p{margin:5px 0 0;opacity:.88;font-size:13px}main{max-width:1000px;margin:auto;padding:14px 14px 88px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 3px 12px #173d2710}.kpi b{display:block;font-size:25px;color:var(--green)}.kpi span,.muted{font-size:12px;color:var(--muted)}.title{margin:18px 0 10px}.title h2{font-size:18px;margin:0}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;padding-bottom:env(safe-area-inset-bottom)}nav button{border:0;background:none;padding:13px 22px;color:var(--muted);font-weight:700}nav button.active{color:var(--green)}section{display:none}section.active{display:block}.rank-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.rank-row{display:grid;grid-template-columns:32px 1fr 58px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.rank-row:last-child{border-bottom:0}.rank1{font-weight:900;color:var(--gold)}table{width:100%;border-collapse:collapse;background:white;border-radius:14px;overflow:hidden}th,td{padding:11px 8px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}th{color:var(--muted);font-size:11px;text-transform:uppercase}.search{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:white;font:inherit;margin-bottom:10px}.history-item{padding:12px 0;border-bottom:1px solid var(--line)}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8f5ed;color:var(--green);font-size:11px;font-weight:700;margin-top:6px}.empty{text-align:center;color:var(--muted);padding:30px}
@media(max-width:760px){.rank-grid{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}nav button{padding:12px 14px;font-size:12px}}
</style></head>
<body><header><h1>⚽ Scout da Pelada</h1><p>Ranking oficial de gols, assistências e títulos</p></header>
<main>
<section id="home" class="active"><div class="grid" id="kpis"></div><div class="rank-grid" style="margin-top:14px"><div class="card"><div class="title" style="margin-top:0"><h2>⚽ Artilharia</h2></div><div id="topGoals"></div></div><div class="card"><div class="title" style="margin-top:0"><h2>🅰️ Assistências</h2></div><div id="topAssists"></div></div><div class="card"><div class="title" style="margin-top:0"><h2>🏆 Campeões</h2></div><div id="topTitles"></div></div></div><div class="title"><h2>Última rodada</h2></div><div class="card" id="lastRound"></div></section>
<section id="ranking"><div class="title"><h2>Ranking completo</h2></div><input class="search" id="rankSearch" placeholder="Buscar jogador..."><div style="overflow:auto"><table><thead><tr><th>Jogador</th><th>Gols</th><th>Assistências</th><th>Títulos</th><th>Rodadas</th></tr></thead><tbody id="rankingBody"></tbody></table></div></section>
<section id="rounds"><div class="title"><h2>Histórico das rodadas</h2></div><div class="card" id="history"></div></section>
</main><nav><button class="active" data-page="home">Início</button><button data-page="ranking">Rankings</button><button data-page="rounds">Rodadas</button></nav>
<script src="seed.js"></script><script>
const KEY='peladaScoutV2';let data;function fresh(){return{players:SEED_PLAYERS.map(p=>({...p,active:true})),rounds:SEED_ROUNDS.map(r=>({...r,scouts:r.scouts.map(s=>({...s}))}))}}function load(){try{data=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{data=fresh()}}
function totals(p){let g=p.goals||0,a=p.assists||0,t=p.titles||0,r=0;data.rounds.forEach(rd=>{const s=rd.scouts.find(x=>x.playerId===p.id);if(s){g+=s.goals;a+=s.assists;t+=s.champion?1:0;r++}});return{g,a,t,r}}
function all(){return data.players.filter(p=>p.active!==false).map(p=>({p,...totals(p)}))}function by(k){return all().sort((x,y)=>y[k]-x[k]||y.g-x.g||y.a-x.a||x.p.name.localeCompare(y.p.name))}
function topHtml(items,key,suffix){return items.slice(0,5).map((x,i)=>`<div class="rank-row"><b class="${i===0?'rank1':''}">${i+1}º</b><span>${x.p.name}</span><b>${x[key]} ${suffix}</b></div>`).join('')}
function render(){const players=all(),goals=players.reduce((s,x)=>s+x.g,0);kpis.innerHTML=`<div class="card kpi"><b>${players.length}</b><span>jogadores ativos</span></div><div class="card kpi"><b>${goals}</b><span>gols acumulados</span></div><div class="card kpi"><b>${data.rounds.length}</b><span>rodadas registradas</span></div>`;topGoals.innerHTML=topHtml(by('g'),'g','');topAssists.innerHTML=topHtml(by('a'),'a','');topTitles.innerHTML=topHtml(by('t'),'t','');const lr=data.rounds.at(-1);lastRound.innerHTML=lr?roundHTML(lr):'<div class="empty">Nenhuma rodada registrada.</div>';renderRanking();renderHistory()}
function renderRanking(){const q=(rankSearch.value||'').toLowerCase();rankingBody.innerHTML=all().filter(x=>x.p.name.toLowerCase().includes(q)).sort((x,y)=>y.g-x.g||y.a-x.a||y.t-x.t||x.p.name.localeCompare(y.p.name)).map(x=>`<tr><td><b>${x.p.name}</b></td><td>${x.g}</td><td>${x.a}</td><td>${x.t}</td><td>${x.r}</td></tr>`).join('')}
function playerName(id){return data.players.find(p=>p.id===id)?.name||'Jogador'}function roundHTML(rd){const champ=rd.scouts.filter(s=>s.champion).map(s=>playerName(s.playerId)).join(', ')||'Não informado';const g=rd.scouts.reduce((n,s)=>n+s.goals,0),a=rd.scouts.reduce((n,s)=>n+s.assists,0);return `<b>${new Date(rd.date+'T12:00:00').toLocaleDateString('pt-BR')}</b><div class="muted">${rd.scouts.length} jogadores · ${g} gols · ${a} assistências</div><div><span class="pill">Campeões: ${champ}</span></div>${rd.note?`<div class="muted" style="margin-top:7px">${rd.note}</div>`:''}`}
function renderHistory(){history.innerHTML=data.rounds.length?data.rounds.slice().reverse().map(rd=>`<div class="history-item">${roundHTML(rd)}</div>`).join(''):'<div class="empty">Nenhuma rodada registrada.</div>'}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,section').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.page).classList.add('active');render()});rankSearch.oninput=renderRanking;load();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
